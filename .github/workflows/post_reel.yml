name: "Post Next Instagram Reel"

on:
  # Automated schedule (Runs on UTC time)
  schedule:
    # Runs twice daily at 1:30 PM & 8:30 PM IST (08:00 & 15:00 UTC)
    - cron: '0 8,15 * * *'

  # Manual on-demand trigger via GitHub UI
  workflow_dispatch:
    inputs:
      share_to_story:
        description: 'Auto-share published reel to Instagram Story? (true/false)'
        required: true
        default: 'true'

# Ensure only one reel upload runs at a time to prevent duplicate posts
concurrency:
  group: instagram-upload-queue
  cancel-in-progress: false

jobs:
  upload-reel:
    name: "Upload Reel to Instagram"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Cloud Reel Poster
        env:
          INSTA_SESSION_JSON: ${{ secrets.INSTA_SESSION_JSON }}
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_ARCHIVE_ID: ${{ secrets.GDRIVE_ARCHIVE_ID }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          SHARE_TO_STORY: ${{ github.event.inputs.share_to_story || 'true' }}
        run: |
          python src/instagram/cloud_post_reel.py
